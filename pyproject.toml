[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcheck"
version = "0.1.0"
description = "Lint Agent Skills and Claude Code plugins before they silently fail to load."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["agent-skills", "claude-code", "plugin", "linter", "validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/skillcheck"
Issues = "https://github.com/Viltrumlik/skillcheck/issues"

[project.scripts]
skillcheck = "skillcheck:main"

[tool.setuptools]
py-modules = ["skillcheck"]
